name: CI

on:
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: conduit
          POSTGRES_PASSWORD: conduit
          POSTGRES_DB: conduit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conduit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke test (server boots and serves /health)
        env:
          CONDUIT_DATA_DIR: ${{ runner.temp }}/conduit-data
          DATABASE_URL: postgres://conduit:conduit@localhost:5432/conduit
          DATABASE_SSL: disable
        run: |
          npm start &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:7456/health > /dev/null 2>&1; then
              echo "Server is healthy"
              kill $SERVER_PID
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to become healthy within 30s"
          kill $SERVER_PID || true
          exit 1
